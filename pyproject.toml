[project]
name = "tubekit-mcp"
version = "0.1.0"
description = "MCP server with YouTube tools: list playlists, fetch and search video transcripts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deno>=2",
    "mcp>=2.3",
    "yt-dlp[default]>=2026.10",
]

[project.scripts]
tubekit-mcp = "tubekit_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
