[project]
name = "youtube-transcript-mcp"
version = "0.1.0"
description = "MCP server to list YouTube playlist videos and fetch video transcripts using yt-dlp"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3",
    "yt-dlp>=2026.10",
]

[project.scripts]
youtube-transcript-mcp = "youtube_transcript_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
