# MCP server + Cloudflare named tunnel. The server is not published on any host
# port: the only way in is through the tunnel, which reaches it as http://mcp:8000.
services:
  mcp:
    build: .
    image: youtube-transcript-mcp:latest
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "8000"
      MCP_SECRET_PATH: ${MCP_SECRET_PATH:?set MCP_SECRET_PATH in .env}
      # Uncomment (and the volume below) if YouTube starts demanding sign-in.
      # YT_COOKIES_FILE: /run/secrets/cookies.txt
    # volumes:
    #   - ./cookies.txt:/run/secrets/cookies.txt:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, socket; socket.create_connection(('127.0.0.1', int(os.environ['PORT'])), 2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      mcp:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
