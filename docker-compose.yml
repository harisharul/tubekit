# Runs TubeKit over HTTP at http://127.0.0.1:8000/mcp (only reachable from this machine).
#   docker compose up -d --build
# Optional: also run a Cloudflare tunnel (set TUNNEL_TOKEN and COMPOSE_PROFILES=cloudflare in .env).
services:
  mcp:
    build: .
    image: tubekit-mcp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MCP_SECRET_PATH: ${MCP_SECRET_PATH:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      TUBEKIT_MAX_CONCURRENCY: ${TUBEKIT_MAX_CONCURRENCY:-4}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256

  tunnel:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      mcp:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
